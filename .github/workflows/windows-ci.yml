name: Windows CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            generator: "Visual Studio 17 2022"
            triplet: x64
            cxx: "cl"
          - os: windows-latest
            arch: Win32
            generator: "Visual Studio 17 2022"
            triplet: x86
            cxx: "cl"
          - os: windows-latest
            arch: x64
            generator: "Ninja"
            triplet: x64
            cxx: "clang-cl"
          - os: windows-latest
            arch: Win32
            generator: "Ninja"
            triplet: x86
            cxx: "clang-cl"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build ^
            -G "${{ matrix.generator }}" ^
            -A ${{ matrix.triplet }} ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGTLIBCPP_BUILD_TESTS=ON ^
            -DGTLIBCPP_BUILD_DEMOS=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: cmd
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Install package
        shell: cmd
        run: |
          cmake --install build --config Release --prefix package
          7z a gtlibcpp-${{ matrix.arch }}.zip package
        if: matrix.cxx == 'cl' && matrix.arch == 'x64'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtlibcpp-${{ matrix.arch }}
          path: gtlibcpp-${{ matrix.arch }}.zip
        if: matrix.cxx == 'cl' && matrix.arch == 'x64'
